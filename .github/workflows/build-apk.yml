
name: Compilar APK de Control de Vencimientos

on:
  workflow_dispatch:
  push:
    paths:
      - 'paquete-para-compilar-APK-en-la-nube.zip'
      - 'control-de-vencimientos-corregido-correo.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v5

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK requerido
        run: |
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Localizar y extraer proyecto
        run: |
          set -e

          echo "Buscando archivos ZIP..."
          find . -type f -name '*.zip' -print

          PROJECT_ZIP="$(find . -type f -name 'control-de-vencimientos-corregido-correo.zip' -print -quit)"

          if [ -z "$PROJECT_ZIP" ]; then
            PACKAGE_ZIP="$(find . -type f -name 'paquete-para-compilar-APK-en-la-nube.zip' -print -quit)"

            if [ -n "$PACKAGE_ZIP" ]; then
              mkdir -p package
              unzip -oq "$PACKAGE_ZIP" -d package
              PROJECT_ZIP="$(find package -type f -name 'control-de-vencimientos-corregido-correo.zip' -print -quit)"
            fi
          fi

          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERROR: No se encontró el ZIP del proyecto Android."
            exit 1
          fi

          echo "Proyecto encontrado: $PROJECT_ZIP"
          unzip -t "$PROJECT_ZIP"

          mkdir -p project
          unzip -oq "$PROJECT_ZIP" -d project

          SETTINGS_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts."
            find project -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Proyecto listo en: $PROJECT_ROOT"

      - name: Generar clave de firma de prueba
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_ROOT/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Compilar APK de prueba
        run: |
          gradle -p "$PROJECT_ROOT" --no-daemon assembleDebug

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: control-de-vencimientos-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

